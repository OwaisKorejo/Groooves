<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get help with Grooves from Jake, our support assistant." />
  <title>Support | Grooves</title>
  <link rel="icon" href="assets/images/icon.png" />
  <style>
    @font-face {
      font-family: "Metropolis";
      src: url("assets/fonts/metropolis.otf") format("opentype");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #111;
      --text: #f5f5f5;
      --muted: #aaa;
      --line: #292929;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.08), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: "Metropolis", Arial, sans-serif;
    }

    header {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0;
    }

    .brand img {
      display: block;
      width: 128px;
      height: auto;
    }

    main {
      width: min(720px, calc(100% - 40px));
      min-height: calc(100vh - 190px);
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 52px 0 90px;
      text-align: center;
    }

    .support-card {
      width: 100%;
      padding: clamp(36px, 7vw, 68px) clamp(24px, 7vw, 64px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(17,17,17,.9);
      box-shadow: 0 28px 80px rgba(0,0,0,.38);
    }

    .icon {
      width: 74px;
      height: 74px;
      margin-bottom: 22px;
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(34px, 7vw, 58px);
      letter-spacing: -.05em;
      line-height: 1;
    }

    p {
      max-width: 520px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    button {
      min-width: 190px;
      padding: 15px 24px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #090909;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:disabled { cursor: wait; opacity: .55; transform: none; }

    .status {
      min-height: 22px;
      margin: 18px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    footer {
      padding: 28px 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    footer a { color: #ddd; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html" aria-label="Grooves home">
      <img src="assets/images/logo_light.png" alt="Grooves" />
    </a>
  </header>

  <main>
    <section class="support-card" aria-labelledby="support-title">
      <img class="icon" src="assets/images/icon.png" alt="" />
      <h1 id="support-title">How can we help?</h1>
      <p>
        Chat with Jake, the Grooves support assistant, for help with your account,
        reviews, collections, Spotify connection, subscriptions, and more.
      </p>
      <button id="open-support" type="button" disabled>Loading support…</button>
      <div class="status" id="support-status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    Business enquiries:
    <a href="mailto:owais@joingrooves.app">owais@joingrooves.app</a>
  </footer>

  <script
    async
    src="https://widget.tryjake.ai/widget.js"
    data-jake-public-key="jake_pk_019f946e-cd35-74ce-b602-6a6c4d8edeef"
  ></script>
  <script>
    (function () {
      var button = document.getElementById("open-support");
      var status = document.getElementById("support-status");
      var attempts = 0;

      function connect() {
        if (window.Jake && typeof window.Jake.show === "function") {
          button.disabled = false;
          button.textContent = "Chat with Jake";
          button.addEventListener("click", function () {
            window.Jake.show();
          });
          return;
        }

        attempts += 1;
        if (attempts < 40) {
          window.setTimeout(connect, 250);
        } else {
          button.textContent = "Support unavailable";
          status.textContent = "Jake couldn’t load. Please refresh the page and try again.";
        }
      }

      connect();
    }());
  </script>
</body>
</html>
