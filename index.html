  <style>
    :root {
      --bg:      #191919;
      --text:    #ffffff;
      --muted:   rgba(255, 255, 255, 0.62);
      --dim:     rgba(255, 255, 255, 0.42);
      --hair:    rgba(255, 255, 255, 0.10);
      --surface: #e6e6e3;
      --ink:     #1b1b1b;
      --font:    "Stack Sans Text", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      /* Carousel geometry — one place, used by the slides and the edge padding. */
      --slide:   min(62vw, 268px);
      --gap:     clamp(14px, 4vw, 24px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      /* A tiling speck texture over the flat grey, so the background has a
         little tooth instead of reading as one dead block of colour. */
      background-color: var(--bg);
      background-image: url("./assets/images/grain.png");
      background-repeat: repeat;
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    main { padding-top: clamp(52px, 12vw, 96px); }

    .hero {
      max-width: 620px;
      margin: 0 auto;
      padding: 0 24px;
      text-align: center;
    }

    .icon {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      display: block;
      margin: 0 auto;
    }

    h1 {
      margin: 26px 0 0;
      line-height: 0;
    }
    h1 img {
      width: clamp(190px, 54vw, 280px);
      height: auto;
      display: inline-block;
    }

    .sub {
      margin: 20px auto 0;
      max-width: 30ch;
      font-size: clamp(15px, 3.9vw, 17px);
      font-weight: 300;
      letter-spacing: 0.005em;
      color: var(--muted);
    }

    /* ── The only thing that matters: the download buttons ── */
    .cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 560px;
      margin: 32px auto 0;
      padding: 0 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      max-width: 240px;
      min-height: 50px;
      padding: 0 20px;
      border-radius: 13px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font);
      font-size: clamp(14px, 3.7vw, 15.5px);
      font-weight: 700;
      letter-spacing: -0.005em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .btn svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .btn:active { opacity: 0.75; transform: scale(0.985); }

    /* Hover effects only where a real cursor exists, so a tap on a phone
       is never swallowed by an element that moved under the finger. */
    @media (hover: hover) and (pointer: fine) {
      .btn:hover { opacity: 0.9; }
    }

    /* Side by side once both fit at a matched width — an uneven pair of
       store buttons reads as a mistake. */
    @media (min-width: 560px) {
      .cta { flex-direction: row; justify-content: center; }
      .btn { width: 240px; max-width: none; }
    }

    /* ── Preview carousel ── */
    .preview { margin-top: clamp(52px, 12vw, 88px); }

    .eyebrow {
      margin: 0 0 clamp(20px, 5vw, 28px);
      text-align: center;
      font-size: 11px;
      font-weight: 200;
      letter-spacing: 0.46em;
      text-indent: 0.46em; /* balance the trailing letter-space so it reads centred */
      text-transform: uppercase;
      color: var(--dim);
    }

    .rail {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--gap);
      /* overflow-y must be pinned: left alone the browser computes it to `auto`
         alongside overflow-x, and the rail then eats the page's vertical scroll.
         The bottom padding (cancelled by the margin) is headroom for the shadow,
         which the hidden overflow would otherwise clip. */
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 0 34px;
      margin-bottom: -34px;
      overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      cursor: grab;
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail.grabbing { cursor: grabbing; scroll-snap-type: none; }
    .rail:focus-visible { outline: none; }

    /* Half-empty rails on each end so the first and last slide can sit centred. */
    .rail::before,
    .rail::after {
      content: "";
      flex: 0 0 max(0px, calc((100% - var(--slide)) / 2 - var(--gap)));
    }

    .slide {
      flex: 0 0 var(--slide);
      width: var(--slide);
      margin: 0;
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }
    .slide img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1419 / 2796;
      object-fit: contain;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5));
      -webkit-user-drag: none;
      user-select: none;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: clamp(24px, 6vw, 34px);
    }
    .dots button {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.25s ease, transform 0.25s ease;
    }
    .dots button.on {
      background: var(--text);
      transform: scale(1.25);
    }

    /* ── Footer ── */
    footer {
      max-width: 620px;
      margin: 0 auto;
      padding: clamp(48px, 10vw, 72px) 24px 48px;
      text-align: center;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin-bottom: 28px;
    }
    .socials a {
      color: var(--muted);
      display: inline-flex;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s ease;
    }
    .socials svg { width: 21px; height: 21px; }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 22px;
      margin-bottom: 18px;
    }
    .links a, .contact a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
    }
    .contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 22px;
      font-size: 14px;
      font-weight: 300;
      color: var(--dim);
      margin-bottom: 22px;
    }
    .copy {
      font-size: 13px;
      font-weight: 300;
      color: var(--dim);
      margin: 0;
    }

    @media (hover: hover) and (pointer: fine) {
      .socials a:hover, .links a:hover, .contact a:hover { color: var(--text); }
      .dots button:hover { background: rgba(255, 255, 255, 0.55); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>

  <script>
    (function () {
      /* Instagram's in-app browser drops Apple's redirect to the App Store, so the
         tap dies. This is Instagram's own hand-off to the system browser, which it
         obeys. Only applied inside Instagram on iOS — the scheme is meaningless
         anywhere else, so every other visitor keeps the plain link in the HTML. */
      var ua = navigator.userAgent || '';
      if (/Instagram/.test(ua) && /iPhone|iPad|iPod/.test(ua)) {
        var store = document.querySelector('a[href^="https://apps.apple.com"]');
        if (store) {
          store.href = 'instagram://extbrowser/?url=' + encodeURIComponent(store.href);
        }
      }

      /* Screenshot rail: swipe on touch, drag or click a dot on desktop. */
      var rail = document.getElementById('rail');
      var dotsBox = document.getElementById('dots');
      if (!rail || !dotsBox) return;

      var slides = Array.prototype.slice.call(rail.querySelectorAll('.slide'));
      if (slides.length < 2) return;

      function centre(slide) {
        var target = slide.offsetLeft - (rail.clientWidth - slide.offsetWidth) / 2;
        var from = rail.scrollLeft;
        rail.scrollTo({ left: target, behavior: 'smooth' });
        /* Some setups ignore smooth scrolling outright and the call is a no-op.
           A real animation is always under way a few frames in, so if nothing has
           budged by then, jump straight there rather than leave the dot lying. */
        setTimeout(function () {
          if (Math.abs(rail.scrollLeft - from) < 1) rail.scrollLeft = target;
        }, 120);
      }

      slides.forEach(function (slide, i) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = i === 0 ? 'on' : '';
        dot.setAttribute('aria-label', 'Show screenshot ' + (i + 1) + ' of ' + slides.length);
        dot.addEventListener('click', function () { centre(slide); });
        dotsBox.appendChild(dot);
      });
      var dots = Array.prototype.slice.call(dotsBox.children);

      var queued = false;
      function markCurrent() {
        queued = false;
        var middle = rail.scrollLeft + rail.clientWidth / 2;
        var current = 0;
        var closest = Infinity;
        slides.forEach(function (slide, i) {
          var d = Math.abs(slide.offsetLeft + slide.offsetWidth / 2 - middle);
          if (d < closest) { closest = d; current = i; }
        });
        dots.forEach(function (dot, i) { dot.classList.toggle('on', i === current); });
      }
      rail.addEventListener('scroll', function () {
        if (queued) return;
        queued = true;
        requestAnimationFrame(markCurrent);
      }, { passive: true });
      window.addEventListener('resize', markCurrent);

      /* Click-and-drag, so a mouse without a horizontal wheel can still browse.
         Snapping is switched off mid-drag, then restored so the release settles
         onto a slide. */
      var dragging = false, originX = 0, originScroll = 0;
      rail.addEventListener('pointerdown', function (e) {
        if (e.pointerType !== 'mouse') return;
        dragging = true;
        originX = e.clientX;
        originScroll = rail.scrollLeft;
        rail.classList.add('grabbing');
      });
      window.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        e.preventDefault();
        rail.scrollLeft = originScroll - (e.clientX - originX);
      });
      window.addEventListener('pointerup', function () {
        if (!dragging) return;
        dragging = false;
        rail.classList.remove('grabbing');
      });
    })();
  </script>
