<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171021" />
  <title>Email verification | Grooves</title>
  <style>
    @font-face {
      font-family: "MontHeavy";
      src: url("./assets/fonts/montheavy.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Metropolis";
      src: url("./assets/fonts/metropolis.otf") format("opentype");
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: #f3eadc;
      background:
        linear-gradient(rgba(18, 10, 25, 0.42), rgba(18, 10, 25, 0.68)),
        url("./assets/images/verification-background.jpeg") center / cover no-repeat;
      font-family: "Metropolis", system-ui, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 680px);
    }

    .label {
      margin: 0 0 14px;
      color: rgba(243, 234, 220, 0.7);
      font-family: "MontHeavy", system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "MontHeavy", system-ui, sans-serif;
      font-size: clamp(42px, 9vw, 72px);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 0.98;
      overflow-wrap: anywhere;
    }

    .message {
      max-width: 520px;
      margin: 22px auto 0;
      color: rgba(243, 234, 220, 0.82);
      font-size: clamp(15px, 3vw, 18px);
      line-height: 1.6;
    }

    .next-step {
      max-width: 520px;
      margin: 12px auto 0;
      color: rgba(243, 234, 220, 0.6);
      font-size: 14px;
      line-height: 1.55;
    }

    .error-code {
      margin: 18px 0 0;
      color: rgba(243, 234, 220, 0.55);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    .error-code[hidden] {
      display: none;
    }

    .instagram {
      display: inline-block;
      margin-top: 28px;
      color: rgba(243, 234, 220, 0.62);
      font-size: 13px;
      text-decoration: none;
    }

    .support {
      margin: 28px 0 0;
      color: rgba(243, 234, 220, 0.62);
      font-size: 13px;
    }

    .support a {
      color: inherit;
    }

    .instagram:hover,
    .instagram:focus-visible {
      color: #f3eadc;
      text-decoration: underline;
    }

    [data-state="success"] .label {
      color: #a5f2c6;
    }

    [data-state="error"] .label {
      color: #ffb0c1;
    }

    noscript p {
      color: #ffb0c1;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main id="verification" data-state="neutral" aria-live="polite">
    <p id="status-label" class="label">Verification incomplete</p>
    <h1 id="status-title">we couldn't confirm your email.</h1>
    <p id="status-message" class="message">
      Open the latest verification email and tap its confirmation button.
    </p>
    <p id="next-step" class="next-step">
      If you already tried the link, return to the Grooves app and request a new email.
    </p>
    <p id="error-code" class="error-code" hidden></p>

    <noscript>
      <p>Open this link again in Safari or Chrome.</p>
    </noscript>

    <p class="support">
      Still having trouble?
      <a href="mailto:support@joingrooves.app">support@joingrooves.app</a>
    </p>

    <a
      class="instagram"
      href="https://www.instagram.com/joingrooves/"
      target="_blank"
      rel="noreferrer"
    >@joingrooves</a>
  </main>

  <script>
    (function () {
      function decode(value) {
        try {
          return decodeURIComponent(String(value || "").replace(/\+/g, " "));
        } catch (error) {
          return String(value || "");
        }
      }

      function parseParams(source) {
        var params = {};
        var value = String(source || "").replace(/^[?#]/, "");
        var pairs;
        var index;
        var separator;
        var key;

        if (!value) return params;

        pairs = value.split("&");
        for (index = 0; index < pairs.length; index += 1) {
          if (!pairs[index]) continue;
          separator = pairs[index].indexOf("=");

          if (separator === -1) {
            params[decode(pairs[index])] = "";
          } else {
            key = decode(pairs[index].slice(0, separator));
            params[key] = decode(pairs[index].slice(separator + 1));
          }
        }

        return params;
      }

      function merge(target, source) {
        var key;
        for (key in source) {
          if (Object.prototype.hasOwnProperty.call(source, key)) {
            target[key] = source[key];
          }
        }
        return target;
      }

      var query = parseParams(window.location.search);
      var hash = parseParams(window.location.hash);
      var params = merge(query, hash);
      var page = document.getElementById("verification");
      var label = document.getElementById("status-label");
      var title = document.getElementById("status-title");
      var message = document.getElementById("status-message");
      var nextStep = document.getElementById("next-step");
      var errorCodeElement = document.getElementById("error-code");
      var errorCode = params.error_code || "";
      var hasError = Boolean(params.error || errorCode);
      var verified = !hasError && Boolean(params.access_token || query.code);

      function render(state, labelText, titleText, messageText, nextStepText) {
        page.setAttribute("data-state", state);
        label.textContent = labelText;
        title.textContent = titleText;
        message.textContent = messageText;
        nextStep.textContent = nextStepText;
      }

      if (verified) {
        render(
          "success",
          "Email verified",
          "your account is ready.",
          "Your email has been confirmed successfully.",
          "Return to the Grooves app and log in."
        );
        document.title = "Email verified | Grooves";
      } else if (hasError) {
        if (errorCode === "otp_expired") {
          render(
            "error",
            "Link no longer valid",
            "this link has expired.",
            "The link may have expired, already been used, or been replaced by a newer email.",
            "Return to the Grooves app and request a new verification email."
          );
        } else if (errorCode === "over_request_rate_limit") {
          render(
            "error",
            "Please wait",
            "too many attempts.",
            "Your network has made too many verification attempts.",
            "Wait a few minutes, then try the newest verification email again."
          );
        } else {
          render(
            "error",
            "Verification failed",
            "we couldn't verify your email.",
            params.error_description || "The verification request could not be completed.",
            "Return to the Grooves app and request a new verification email."
          );
        }

        if (errorCode) {
          errorCodeElement.textContent = "Error: " + errorCode;
          errorCodeElement.removeAttribute("hidden");
        }
        document.title = "Verification failed | Grooves";
      }

      if (
        (window.location.hash || window.location.search) &&
        window.history &&
        window.history.replaceState
      ) {
        try {
          window.history.replaceState(null, document.title, window.location.pathname);
        } catch (error) {
          // The result is already visible, so URL cleanup is non-essential.
        }
      }

      // Browsers can treat another verification URL opened in the same tab as
      // a fragment-only navigation. Reload so the new Auth result is processed.
      window.addEventListener("hashchange", function () {
        if (window.location.hash) {
          window.location.reload();
        }
      });
    }());
  </script>
</body>
</html>
