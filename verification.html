<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./assets/images/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email | Grooves</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
      color: rgba(255, 255, 255, 0.87);
      background-color: #121212;
      font-smoothing: antialiased;
    }
    @font-face {
      font-family: "EuropaBold";
      src: url("assets/fonts/europa.otf") format("woff2");
    }
    @font-face {
      font-family: "Regular";
      src: url("assets/fonts/metropolis.otf") format("opentype");
    }
    @font-face {
      font-family: "Buttoner";
      src: url("assets/fonts/ok.otf") format("opentype");
    }
    #root {
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
      text-align: center;
      box-sizing: border-box;
    }
    .logo {
      height: 140px;
      transition: filter 300ms;
    }
    .logo:hover {
      filter: drop-shadow(0 0 32px #646cffaa);
    }
    h1 {
      font-family: "EuropaBold";
      font-size: 60px;
      line-height: 1.08;
      margin: 20px 0 16px;
    }
    @media (max-width: 768px) {
      h1 { font-size: 40px; }
    }
    @media (max-width: 480px) {
      h1 { font-size: 30px; }
      .logo { height: 100px; }
    }
    p {
      font-family: "Regular";
      font-size: 18px;
      margin: 0;
    }
    .message {
      max-width: 600px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.6;
    }
    .status-code {
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 14px;
    }
    .social-icons {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .social-icons a {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 25px;
      background-color: #464646;
      color: #fff;
      transition: transform 0.2s;
      text-decoration: none;
    }
    .social-icons a:hover {
      transform: scale(1.1);
    }
    @media (prefers-color-scheme: light) {
      html, body {
        color: rgba(255,255,255,0.87);
        background-color: #121212;
      }
      .social-icons a {
        background-color: #464646;
        color: white;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <img src="./assets/images/logo_no_background.png" class="logo" alt="Grooves" />
    <div id="verification-status" aria-live="polite">
      <h1 id="status-title">checking your verification...</h1>
      <p id="status-message" class="message">
        Please wait while we check the result from your confirmation link.
      </p>
      <p id="status-code" class="status-code" hidden></p>
    </div>
    <div class="social-icons">
      <a href="https://www.instagram.com/grooves.app/" target="_blank" rel="noreferrer" aria-label="Grooves on Instagram">
        <i class="fa-brands fa-instagram" style="color:white;"></i>
      </a>
      <a href="https://www.tiktok.com/@grooovesapp" target="_blank" rel="noreferrer" aria-label="Grooves on TikTok">
        <i class="fa-brands fa-tiktok" style="color:white;"></i>
      </a>
    </div>
  </div>
  <script>
    (() => {
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const queryParams = new URLSearchParams(window.location.search);
      const getParam = (name) =>
        hashParams.get(name) || queryParams.get(name);

      const title = document.getElementById("status-title");
      const message = document.getElementById("status-message");
      const statusCode = document.getElementById("status-code");

      const error = getParam("error");
      const errorCode = getParam("error_code");
      const errorDescription = getParam("error_description");
      const verificationType = getParam("type");
      const hasImplicitSession =
        hashParams.has("access_token") && hashParams.has("refresh_token");
      const hasPkceCode = queryParams.has("code");
      const verified =
        !error &&
        !errorCode &&
        ((verificationType === "signup" && hasImplicitSession) || hasPkceCode);

      if (verified) {
        title.textContent = "your account is now verified.";
        message.textContent =
          "You can return to the Grooves app and log in.";
      } else if (error || errorCode) {
        if (errorCode === "otp_expired") {
          title.textContent = "this verification link isn't valid anymore.";
          message.textContent =
            "It may have expired, already been used, or been replaced by a newer email. Return to the Grooves app and request a new verification email.";
        } else if (errorCode === "over_request_rate_limit") {
          title.textContent = "too many verification attempts.";
          message.textContent =
            "Wait a few minutes, then open the link in your latest verification email again.";
        } else {
          title.textContent = "we couldn't verify your email.";
          message.textContent =
            errorDescription ||
            "Return to the Grooves app and request a new verification email.";
        }

        if (errorCode) {
          statusCode.textContent = `Error: ${errorCode}`;
          statusCode.hidden = false;
        }
      } else {
        title.textContent = "we couldn't confirm your email.";
        message.textContent =
          "Open the latest verification email and tap its confirmation button. If that still doesn't work, request a new email from the Grooves app.";
      }

      // Successful redirects contain session credentials in the fragment.
      // Remove all Auth parameters from browser history after reading them.
      if (window.location.hash || window.location.search) {
        window.history.replaceState(null, document.title, window.location.pathname);
      }
    })();
  </script>
</body>
</html>
